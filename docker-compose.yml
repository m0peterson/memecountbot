services:
  memecountbot:
    build: .
    image: memecountbot
    container_name: memecountbot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/memecount.db
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
